# 监控服务端配置
server:
  port: 8080

spring:
  application:
    name: monitor-server
  datasource:
    url: ${MONITOR_DB_URL:jdbc:postgresql://localhost:5432/monitor_platform}
    username: ${MONITOR_DB_USERNAME:}
    password: ${MONITOR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

monitor:
  server:
    # 推送间隔（毫秒）
    push-interval: 3000
    # 客户端超时判定时间（毫秒），超过此时间未收到数据则判定离线
    client-timeout: 30000
    # 告警评估与生命周期持久化间隔（毫秒）
    alert-interval: 5000
  web:
    allowed-origins: ${MONITOR_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.monitor: INFO
