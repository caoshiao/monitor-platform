<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监控仪表盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0a0e17;
            color: #e0e6ed;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .status-bar {
            background: #141824;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 16px;
            font-size: 13px; color: #8899aa;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
        .status-dot.disconnected { background: #f44336; box-shadow: 0 0 6px #f44336; }
        .client-section {
            background: #141824;
            border: 1px solid #2a3040;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .client-header {
            background: #1a1f2e;
            padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #2a3040;
        }
        .client-header h2 { font-size: 16px; color: #64b5f6; }
        .client-tabs { display: flex; gap: 4px; }
        .client-tabs button {
            background: #1e2434; border: 1px solid #2a3040; color: #8899aa;
            padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .client-tabs button.active { background: #64b5f6; color: #0a0e17; border-color: #64b5f6; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .metric-card {
            background: #1a1f2e;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 16px;
        }
        .metric-label { font-size: 12px; color: #8899aa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-size: 28px; font-weight: 700; }
        .metric-value.green { color: #4caf50; }
        .metric-value.yellow { color: #ff9800; }
        .metric-value.red { color: #f44336; }
        .metric-value.blue { color: #64b5f6; }
        .metric-unit { font-size: 14px; color: #8899aa; margin-left: 2px; }
        .progress-bar {
            height: 6px; background: #2a3040; border-radius: 3px;
            margin-top: 8px; overflow: hidden;
        }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.8s; }
        .progress-fill.green { background: #4caf50; }
        .progress-fill.yellow { background: #ff9800; }
        .progress-fill.red { background: #f44336; }
        .table-wrap { padding: 0 20px 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; background: #1a1f2e; color: #8899aa; font-weight: 500; border-bottom: 1px solid #2a3040; position: sticky; top: 0; }
        td { padding: 10px 12px; border-bottom: 1px solid #1e2434; }
        tr:hover td { background: rgba(100, 181, 246, 0.05); }
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
        }
        .badge-up { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .badge-down { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .badge-running { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .badge-stopped { background: rgba(158, 158, 158, 0.2); color: #9e9e9e; }
        .badge-unhealthy { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .no-data { padding: 40px; text-align: center; color: #556677; }
        .section-title { padding: 20px 20px 0; font-size: 14px; color: #8899aa; letter-spacing: 1px; text-transform: uppercase; }
        @media (max-width: 768px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="container" id="container">
    <div class="status-bar">
        <span class="status-dot disconnected" id="connDot"></span>
        <span id="connText">未连接</span>
        <span>| 在线节点: <strong id="onlineCount">0</strong></span>
    </div>
    <div id="dashboard">
        <div class="no-data">正在连接服务端...</div>
    </div>
</div>

<script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = protocol + '//' + location.host + '/ws/frontend';
    let ws;

    function connect() {
        ws = new WebSocket(wsUrl);
        ws.onopen = function() {
            document.getElementById('connDot').className = 'status-dot connected';
            document.getElementById('connText').textContent = '已连接';
        };
        ws.onclose = function() {
            document.getElementById('connDot').className = 'status-dot disconnected';
            document.getElementById('connText').textContent = '已断开';
            setTimeout(connect, 3000);
        };
        ws.onerror = function() { ws.close(); };
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                renderDashboard(data);
            } catch(e) { console.error('数据解析失败:', e); }
        };
    }
    connect();

    var activeTabs = {};

    function renderDashboard(data) {
        var snapshots = data.clientSnapshots || [];
        document.getElementById('onlineCount').textContent = snapshots.length;

        if (snapshots.length === 0) {
            document.getElementById('dashboard').innerHTML = '<div class="no-data">暂无在线节点</div>';
            return;
        }

        var html = '';
        snapshots.forEach(function(s) { html += buildClientSection(s); });
        document.getElementById('dashboard').innerHTML = html;

        document.querySelectorAll('.client-tabs button').forEach(function(btn) {
            btn.onclick = function() {
                switchTab(this.getAttribute('data-client'), this.getAttribute('data-tab'));
            };
        });

        snapshots.forEach(function(s) {
            var cid = s.clientId || 'unknown';
            if (activeTabs[cid]) switchTab(cid, activeTabs[cid]);
        });
    }

    function switchTab(clientId, tab) {
        activeTabs[clientId] = tab;
        document.querySelectorAll('.client-tabs button[data-client="' + clientId + '"]').forEach(function(b) { b.className = ''; });
        var btn = document.querySelector('.client-tabs button[data-client="' + clientId + '"][data-tab="' + tab + '"]');
        if (btn) btn.className = 'active';
        var section = document.getElementById('section-' + clientId);
        if (!section) return;
        section.querySelectorAll('.tab-content').forEach(function(tc) { tc.style.display = 'none'; });
        var target = section.querySelector('.tab-' + tab);
        if (target) target.style.display = 'block';
    }

    function buildClientSection(snap) {
        var cid = snap.clientId || 'unknown';
        var hostname = snap.hostname || cid;
        var sys = snap.systemMetrics || {};
        var docker = snap.dockerMetrics || {};
        var ms = snap.microserviceMetrics || {};

        var html = '<div class="client-section" id="section-' + cid + '">';
        html += '<div class="client-header">';
        html += '<h2>🖥 ' + hostname + ' <span style="font-size:12px;color:#8899aa;">(' + cid + ')</span></h2>';
        html += '<div class="client-tabs">';
        html += '<button data-client="' + cid + '" data-tab="system">系统</button>';
        html += '<button data-client="' + cid + '" data-tab="docker">Docker</button>';
        html += '<button data-client="' + cid + '" data-tab="microservice">微服务</button>';
        html += '</div></div>';

        html += '<div class="tab-content tab-system">' + buildSystemMetrics(sys) + '</div>';
        html += '<div class="tab-content tab-docker" style="display:none;">' + buildDockerMetrics(docker) + '</div>';
        html += '<div class="tab-content tab-microservice" style="display:none;">' + buildMicroserviceMetrics(ms) + '</div>';
        html += '</div>';
        return html;
    }

    function buildSystemMetrics(sys) {
        if (!sys || Object.keys(sys).length === 0) return '<div class="no-data">暂无系统指标数据</div>';
        return '<div class="metrics-grid">' +
            metricCard('CPU 使用率', (sys.cpuUsage||0).toFixed(1), '%', sys.cpuUsage, 'CPU') +
            metricCard('内存使用率', (sys.memoryUsage||0).toFixed(1), '%', sys.memoryUsage, 'MEM') +
            metricCard('磁盘使用率', (sys.diskUsage||0).toFixed(1), '%', sys.diskUsage, 'DISK') +
            metricCard('JVM 堆使用', (sys.jvmHeapUsage||0).toFixed(1), '%', sys.jvmHeapUsage, 'JVM') +
            metricCard('已用内存', (sys.usedMemoryGB||0).toFixed(1), ' / ' + (sys.totalMemoryGB||0).toFixed(1) + ' GB', sys.memoryUsage||0, 'MEM') +
            metricCard('已用磁盘', (sys.usedDiskGB||0).toFixed(1), ' / ' + (sys.totalDiskGB||0).toFixed(1) + ' GB', sys.diskUsage||0, 'DISK') +
            metricCard('网络接收', (sys.networkRxKBs||0).toFixed(1), 'KB/s', 0, '') +
            metricCard('网络发送', (sys.networkTxKBs||0).toFixed(1), 'KB/s', 0, '') +
            metricCard('CPU 核心', sys.cpuCores||0, '核', 0, '') +
            metricCard('运行时间', (sys.uptimeMinutes||0), '分钟', 0, '') +
            metricCard('负载(1m)', (sys.loadAverage||0).toFixed(2), '', 0, '') +
            metricCard('IP 地址', sys.hostname||'unknown', '', 0, '') +
        '</div>';
    }

    function buildDockerMetrics(docker) {
        if (!docker || docker.totalContainers == null || docker.totalContainers < 0)
            return '<div class="no-data">Docker 未启用或采集失败</div>';
        var html = '<div class="metrics-grid">' +
            metricCard('容器总数', docker.totalContainers||0, '个', 0, '') +
            metricCard('运行中', docker.runningContainers||0, '个', 0, '') +
            metricCard('已停止', docker.stoppedContainers||0, '个', 0, '') +
            metricCard('异常', docker.unhealthyContainers||0, '个', 0, '') +
            metricCard('镜像总数', docker.totalImages||0, '个', 0, '') +
        '</div>';
        var containers = docker.containers || [];
        if (containers.length > 0) {
            html += '<div class="section-title">容器详情</div><div class="table-wrap"><table>';
            html += '<tr><th>容器名称</th><th>镜像</th><th>状态</th><th>运行时长</th><th>CPU</th><th>内存(MB)</th><th>端口</th></tr>';
            containers.forEach(function(c) {
                var b = c.status === 'running' ? 'badge-running' : c.status === 'exited' ? 'badge-stopped' : 'badge-unhealthy';
                html += '<tr>' +
                    '<td>' + (c.name||'') + '</td><td>' + (c.image||'') + '</td>' +
                    '<td><span class="badge ' + b + '">' + (c.status||'') + '</span></td>' +
                    '<td>' + (c.uptime||'') + '</td>' +
                    '<td>' + (c.cpuUsage ? c.cpuUsage.toFixed(1)+'%' : '-') + '</td>' +
                    '<td>' + (c.memoryUsageMB ? c.memoryUsageMB.toFixed(1) : '-') + '</td>' +
                    '<td>' + (c.ports||'-') + '</td></tr>';
            });
            html += '</table></div>';
        }
        return html;
    }

    function buildMicroserviceMetrics(ms) {
        if (!ms || ms.totalServices == null || ms.totalServices < 0)
            return '<div class="no-data">微服务监控未启用或采集失败</div>';
        var html = '<div class="metrics-grid">' +
            metricCard('服务总数', ms.totalServices||0, '个', 0, '') +
            metricCard('健康', ms.healthyServices||0, '个', 0, '') +
            metricCard('异常', ms.unhealthyServices||0, '个', 0, '') +
        '</div>';
        var services = ms.services || [];
        if (services.length > 0) {
            html += '<div class="section-title">服务详情</div><div class="table-wrap"><table>';
            html += '<tr><th>服务名称</th><th>地址</th><th>端口</th><th>状态</th><th>响应时间(ms)</th><th>错误信息</th></tr>';
            services.forEach(function(svc) {
                html += '<tr>' +
                    '<td>' + (svc.serviceName||'') + '</td>' +
                    '<td>' + (svc.serviceUrl||'') + '</td>' +
                    '<td>' + (svc.port||'-') + '</td>' +
                    '<td><span class="badge ' + (svc.healthStatus==='UP'?'badge-up':'badge-down') + '">' + (svc.healthStatus||'UNKNOWN') + '</span></td>' +
                    '<td>' + (svc.responseTimeMs>=0 ? svc.responseTimeMs : '-') + '</td>' +
                    '<td style="color:#f44336;">' + (svc.errorMessage||'') + '</td></tr>';
            });
            html += '</table></div>';
        }
        return html;
    }

    function metricCard(label, value, unit, usage, type) {
        var cls = 'blue';
        if (type==='CPU'||type==='MEM'||type==='DISK'||type==='JVM') {
            if (usage>90) cls='red'; else if (usage>70) cls='yellow'; else if (usage>0) cls='green';
        }
        var bar = '';
        if ((type==='CPU'||type==='MEM'||type==='DISK'||type==='JVM') && usage>0) {
            var pc = usage>90?'red':usage>70?'yellow':'green';
            bar = '<div class="progress-bar"><div class="progress-fill ' + pc + '" style="width:' + Math.min(usage,100) + '%"></div></div>';
        }
        return '<div class="metric-card"><div class="metric-label">'+label+'</div><div class="metric-value '+cls+'">'+value+'<span class="metric-unit">'+unit+'</span></div>'+bar+'</div>';
    }
</script>
</body>
</html>
