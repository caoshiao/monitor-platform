# 监控客户端配置
monitor:
  client:
    # 客户端唯一标识（留空则自动使用主机名）
    client-id: server-node-01
    # 节点对外 IP，页面显示该值；留空时自动获取。
    node-ip-address: 192.168.140.128
    # 服务端 WebSocket 地址
    server-url: ws://localhost:8080/ws/client
    # 启用系统监控（CPU/内存/磁盘/网络）
    system-enabled: true
    # 启用 Docker 监控
    docker-enabled: false
    # Docker 守护进程地址（Linux 默认 unix socket，Windows 使用 tcp）
    # docker-host: unix:///var/run/docker.sock
    # docker-host: tcp://localhost:2375
    # 启用外部系统双探针监控
    microservice-enabled: false
    # 中间件可用性监控，与外部接口列表分别统计；填写实际地址后开启。
    middleware-enabled: ${MIDDLEWARE_ENABLED:false}
    middleware-collect-interval-ms: ${MIDDLEWARE_COLLECT_INTERVAL_MS:10000}
    # 探针超时、并发和响应读取上限复用下方 microservice-* 配置。
    # 默认地址指向客户端本机；按实际部署修改环境变量，未部署的实例应从列表移除。
    # 客户端运行在容器内时，127.0.0.1 指向客户端容器，需要改为可访问的中间件地址。
    middlewares:
      - name: Nginx 网关
        middleware-type: nginx
        probe-mode: HTTP
        host: ${MIDDLEWARE_NGINX_HOST:127.0.0.1}
        port: ${MIDDLEWARE_NGINX_PORT:80}
        # 需要在 Nginx 中配置 location = /basic_status { stub_status; }，并允许客户端访问。
        health-url: ${MIDDLEWARE_NGINX_HEALTH_URL:http://127.0.0.1:80/basic_status}
        expected-status-max: 299
        expected-body-contains: 'Active connections:'
      - name: RabbitMQ 消息队列
        middleware-type: rabbitmq
        probe-mode: HTTP
        host: ${MIDDLEWARE_RABBITMQ_HOST:127.0.0.1}
        port: ${MIDDLEWARE_RABBITMQ_PORT:15672}
        # 需要启用管理插件；检查资源告警，存在告警时健康接口返回失败状态。
        health-url: ${MIDDLEWARE_RABBITMQ_HEALTH_URL:http://127.0.0.1:15672/api/health/checks/alarms}
        expected-status-max: 299
        request-headers:
          # 填写完整的 Basic 认证请求头，通过环境变量提供，不在配置中保存账号密码。
          Authorization: ${MIDDLEWARE_RABBITMQ_AUTHORIZATION:}
      - name: OnlyOffice 文档服务
        middleware-type: onlyoffice
        probe-mode: HTTP
        host: ${MIDDLEWARE_ONLYOFFICE_HOST:127.0.0.1}
        port: ${MIDDLEWARE_ONLYOFFICE_PORT:80}
        # 适用于 OnlyOffice 文档服务；端口应填写实际映射的 HTTP 端口。
        health-url: ${MIDDLEWARE_ONLYOFFICE_HEALTH_URL:http://127.0.0.1:80/healthcheck}
        expected-status-max: 299
        expected-body-contains: 'true'
      - name: MinIO 对象存储
        middleware-type: minio
        probe-mode: HTTP
        host: ${MIDDLEWARE_MINIO_HOST:127.0.0.1}
        port: ${MIDDLEWARE_MINIO_PORT:9000}
        # 使用对象存储 API 端口，不能填写控制台端口。
        health-url: ${MIDDLEWARE_MINIO_HEALTH_URL:http://127.0.0.1:9000/minio/health/live}
        expected-status-max: 299
      - name: Redis 缓存
        middleware-type: redis
        # Redis 没有 HTTP 健康接口，使用原生协议认证并执行 PING。
        probe-mode: REDIS
        host: ${MIDDLEWARE_REDIS_HOST:127.0.0.1}
        port: ${MIDDLEWARE_REDIS_PORT:6379}
        username: ${MIDDLEWARE_REDIS_USERNAME:}
        password: ${MIDDLEWARE_REDIS_PASSWORD:}
    microservice-collect-interval-ms: ${EXTERNAL_SYSTEM_COLLECT_INTERVAL_MS:10000}
    microservice-connect-timeout-ms: ${EXTERNAL_SYSTEM_CONNECT_TIMEOUT_MS:3000}
    microservice-read-timeout-ms: ${EXTERNAL_SYSTEM_READ_TIMEOUT_MS:5000}
    microservice-probe-parallelism: ${EXTERNAL_SYSTEM_PROBE_PARALLELISM:4}
    microservice-max-response-bytes: ${EXTERNAL_SYSTEM_MAX_RESPONSE_BYTES:65536}
    microservice-ssl-verify: ${EXTERNAL_SYSTEM_SSL_VERIFY:false}
    # 数据库监控。type 为产品标识，collector 为采集方言；新增数据库时新增对应采集器并配置其标识。
    database:
      enabled: true
      type: hgdb
      collector: postgresql
      display-name: 瀚高数据库
      url-prefix: "jdbc:highgo:"
      driver-class: com.highgo.jdbc.Driver
      # 入口库仅用于发现实例数据库，实际监控范围为全部可连接的非模板数据库。
      url: jdbc:highgo://192.168.140.128:5866/kcc_main
      username: szh
      password: ${HIGHGO_PASSWORD:Szh@111111}
      collect-interval-ms: 5000
      connect-timeout-seconds: 5
      query-timeout-seconds: 10
      long-transaction-seconds: 300
      # 瀚高安全版不启用 PostgreSQL client backend 过滤。
      client-backend-only: false
      excluded-databases:
        - highgo
      # 登录失败及大表查询从普通文本日志增量读取，不读取二进制 hgaudit 目录。
      server-log-directory: ${HIGHGO_SERVER_LOG_DIRECTORY:}
      server-log-pattern: "${HIGHGO_SERVER_LOG_PATTERN:*.*}"
      login-failure-patterns:
        - ",28P01,"
        - ",28000,"
        - password authentication failed
        - authentication failed
        - chances to enter your password before your account get locked
        - 口令认证失败
        - 密码认证失败
        - 密码错误
      login-failure-window-hours: ${HIGHGO_LOGIN_FAILURE_WINDOW_HOURS:24}
      log-max-read-bytes-per-cycle: ${HIGHGO_LOG_MAX_READ_BYTES_PER_CYCLE:1048576}
      collector-state-path: ${HIGHGO_COLLECTOR_STATE_PATH:/opt/monitor-platform/data/highgo-collector.state}
      large-table-size-mb: ${HIGHGO_LARGE_TABLE_SIZE_MB:50}
      large-query-max-rows: ${HIGHGO_LARGE_QUERY_MAX_ROWS:100}
      large-query-window-minutes: ${HIGHGO_LARGE_QUERY_WINDOW_MINUTES:60}

    # 旧版瀚高配置仅用于兼容尚未迁移的部署。配置 database 后本段不会生效。
    highgo-enabled: true
    highgo-collect-interval-ms: 5000
    # 入口库仅用于发现实例数据库，必须是监控账号 szh 能连接的数据库；实际监控范围为全部可连接的非模板数据库。
    highgo-url: jdbc:highgo://192.168.140.128:5866/kcc_main
    # 安全管理库 highgo 不参与业务数据库监控。
    highgo-excluded-databases:
      - highgo
    highgo-driver-class: com.highgo.jdbc.Driver
    highgo-username: szh
    highgo-password: ${HIGHGO_PASSWORD:Szh@111111}
    # 登录失败从普通数据库文本日志增量采集；必须配置实际日志目录，而不是二进制 hgaudit 目录。
    highgo-server-log-directory: ${HIGHGO_SERVER_LOG_DIRECTORY:}
    highgo-server-log-pattern: "${HIGHGO_SERVER_LOG_PATTERN:*.*}"
    highgo-login-failure-patterns:
      - ",28P01,"
      - ",28000,"
      - password authentication failed
      - authentication failed
      - chances to enter your password before your account get locked
      - 口令认证失败
      - 密码认证失败
      - 密码错误
    highgo-login-failure-window-hours: ${HIGHGO_LOGIN_FAILURE_WINDOW_HOURS:24}
    highgo-log-max-read-bytes-per-cycle: ${HIGHGO_LOG_MAX_READ_BYTES_PER_CYCLE:1048576}
    highgo-collector-state-path: ${HIGHGO_COLLECTOR_STATE_PATH:/opt/monitor-platform/data/highgo-collector.state}
    # 大表全字段查询从瀚高 csvlog 增量读取。
    highgo-large-table-size-mb: ${HIGHGO_LARGE_TABLE_SIZE_MB:50}
    highgo-large-query-max-rows: ${HIGHGO_LARGE_QUERY_MAX_ROWS:100}
    highgo-large-query-window-minutes: ${HIGHGO_LARGE_QUERY_WINDOW_MINUTES:60}
    highgo-statement-candidate-multiplier: ${HIGHGO_STATEMENT_CANDIDATE_MULTIPLIER:5}
    highgo-statement-retry-interval-ms: ${HIGHGO_STATEMENT_RETRY_INTERVAL_MS:60000}
    # 外部系统双探针配置：host/port 用于 TCP 探测，health-url 用于接口探测。
    microservices:
      # - name: 统一身份认证系统
      #   host: 10.1.0.20
      #   port: 8080
      #   health-url: http://10.1.0.20:8080/api/status
      #   request-method: GET
      #   expected-status-min: 200
      #   expected-status-max: 299
      #   expected-body-contains: success
      #   request-headers:
      #     Authorization: ${IDENTITY_HEALTH_TOKEN:}

spring:
  application:
    name: monitor-client

logging:
  level:
    com.monitor: DEBUG
server:
  port: 8081
