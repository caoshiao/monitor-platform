# ============================================================
# Monitor Server 生产配置（外挂）
# 部署后修改，systemctl restart monitor-server 即生效
# ============================================================

server:
  port: 8080

spring:
  application:
    name: monitor-server

monitor:
  server:
    push-interval: 3000
    client-timeout: 30000
    alert-interval: 5000
    discrete-alert-hold-minutes: ${MONITOR_DISCRETE_ALERT_HOLD_MINUTES:60}
    login-alert-merge-hours: ${MONITOR_LOGIN_ALERT_MERGE_HOURS:24}

logging:
  level:
    root: INFO
    com.monitor: INFO
  file:
    path: ./logs
    name: ./logs/monitor-server.log
