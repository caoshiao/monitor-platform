# ============================================================
# Monitor Server 生产配置（外挂）
# 部署后修改，systemctl restart monitor-server 即生效
# ============================================================

server:
  port: 8080

spring:
  application:
    name: monitor-server
  datasource:
    url: ${MONITOR_DB_URL:jdbc:postgresql://127.0.0.1:55432/monitor_platform}
    username: ${MONITOR_DB_USERNAME:szh}
    password: ${MONITOR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

monitor:
  server:
    push-interval: 3000
    client-timeout: 30000
    alert-interval: 5000
    discrete-alert-hold-minutes: ${MONITOR_DISCRETE_ALERT_HOLD_MINUTES:60}
    login-alert-merge-hours: ${MONITOR_LOGIN_ALERT_MERGE_HOURS:24}

logging:
  level:
    root: INFO
    com.monitor: INFO
  file:
    path: ./logs
    name: ./logs/monitor-server.log
