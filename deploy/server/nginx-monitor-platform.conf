# 放入 Nginx 的 conf.d 目录；如已存在 nemp 站点，将 location 合并到该站点，避免重复定义。
# 后端地址必须能从 Nginx 容器访问，按实际部署修改此处。
upstream monitor_platform_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name 10.1.0.230 nemp nempa;

    # 将 dist 内的文件放入此目录下的 monitor-platform 子目录。
    root /usr/share/nginx/html;
    index index.html;

    location = /monitor-platform {
        return 301 /monitor-platform/$is_args$args;
    }

    # 保留后端原始 /api 路径，移除前端站点前缀。
    location ^~ /monitor-platform/api/ {
        proxy_pass http://monitor_platform_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /monitor-platform/ws/ {
        proxy_pass http://monitor_platform_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 配置文件和入口页面不缓存，避免更新后继续引用旧资源。
    location = /monitor-platform/config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /monitor-platform/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /monitor-platform/admin.html {
        add_header Cache-Control "no-cache";
    }

    location /monitor-platform/ {
        try_files $uri $uri/ =404;
    }
}
